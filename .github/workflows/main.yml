name: Build Powercuff Tweak

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  push:
    tags:
      - 'v*' # Runs automatically when a version tag (like v1.0.0) is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your fork of the Powercuff repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install core dependencies for the build system
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git clang curl libxml2-dev make perl \
          python3-dev rsync subversion unzip zip libssl-dev

      # Step 3: Setup the Theos iOS build system
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -sLO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_2.1.5-procursus7_linux_$(uname -m).tar.gz
          tar -xzf ldid_2.1.5-procursus7_linux_$(uname -m).tar.gz
          chmod +x ldid
          sudo mv ldid $HOME/theos/bin/ldid
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      # Step 4: CRITICAL - Provide the iOS SDK.
      # This step will fail initially. See the note below.
      - name: Setup iOS SDK (Placeholder)
        run: |
          echo "ERROR: This step must be configured manually."
          echo "You must obtain the iPhoneOS SDK (e.g., iPhoneOS17.0.sdk)."
          echo "Place the extracted SDK folder in your repository under 'sdks/'."
          echo "Then, uncomment the lines below or replace this step."
          exit 1
          # mkdir -p $HOME/theos/sdks
          # cp -R $GITHUB_WORKSPACE/sdks/iPhoneOS*.sdk $HOME/theos/sdks/

      # Step 5: Build the tweak and create the .deb package
      - name: Build Tweak
        run: |
          cd $GITHUB_WORKSPACE
          make clean
          make package

      # Step 6: Upload the built .deb package as a workflow artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Powercuff-Deb-Package
          path: ${{ github.workspace }}/packages/*.deb
          if-no-files-found: error

      # Optional Step 7: Automatically create a GitHub Release (only runs on tag push)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2[citation:6]
        with:
          files: ${{ github.workspace }}/packages/*.deb
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
